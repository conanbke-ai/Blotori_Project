name: Blotori Visual QA Temp

on:
  push:
    branches: [feature/composer-workspace-v2]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BLOTORI_MOCK_MODE: "true"
      OPENAI_MODEL: "gpt-5.6-luna"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production app
        run: |
          npm run start -- -H 127.0.0.1 > /tmp/blotori-start.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/blotori-start.log
          exit 1

      - name: Capture screenshots
        run: node scripts/visual-qa-temp.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blotori-visual-qa
          path: visual-qa-artifacts/
          if-no-files-found: error
