name: Blotori Active Work Sync Temp

on:
  push:
    branches: [feature/composer-workspace-v2]
    paths: [.github/workflows/active-work-sync-temp.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Record current workspace implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ACTIVE_WORK.md')
          text = p.read_text()
          anchor = '- 외부 생성 이미지 슬롯 drag/drop + 로컬 미리보기 UX\n'
          additions = '''- 사용자 참고자료 업로드 + 브라우저 내 자료함 + 생성 요청 직접 첨부\n- 이름을 붙여 재사용하는 `내 문체` 프로필 + 블로그/포스팅/붙여넣기/직접설정 분석\n- 문체·자료 `.blotori` 공유 팩 import/export\n- Composer V2 3-column workspace + canonical Blotori 얼굴/전체 캐릭터/생성 로딩 visual QA\n'''
          if additions not in text:
              text = text.replace(anchor, anchor + additions, 1)
          checkbox_anchor = '- [x] 이미지 슬롯 변경 CI TypeScript / production build 통과\n'
          checks = '''- [x] 참고자료 PDF/DOCX/TXT/MD 업로드 + 선택 자료 생성 요청 첨부\n- [x] 브라우저 내 자료함(IndexedDB) 재사용\n- [x] 이름 지정형 내 문체 저장/재사용 + 기본 강도 저장\n- [x] 블로그 전체 / 포스팅 1개 / 글 붙여넣기 / 직접 설정 문체 분석 UI\n- [x] 문체 프로필명은 생성 본문 프롬프트에서 분리하고 스타일 signature만 적용\n- [x] `.blotori` 문체·자료 공유 팩 import/export\n- [x] canonical Blotori 얼굴 아이콘 / 전체 캐릭터 / 생성 로딩 자산 정상 복구\n- [x] AssetStudio를 Home 내부 직접 렌더로 전환해 React hydration mismatch 제거\n- [x] 2026-09-15 desktop/tablet/mobile production visual QA + canonical asset decode PASS\n- [x] 2026-09-15 TypeScript / platform export QA / production build PASS\n'''
          if checks not in text:
              text = text.replace(checkbox_anchor, checkbox_anchor + checks, 1)
          validation_anchor = '- 이미지 슬롯 업로드 적용 commit `a0658f75ed03d7a86d2a745d725976999d352629`도 TypeScript check / production build PASS\n'
          validation = '- 2026-09-15 Composer V2 user-asset/hydration 수정본도 TypeScript check / platform export QA / production build PASS; dev hydration diagnostics `NO_HYDRATION_MESSAGES`.\n'
          if validation not in text:
              text = text.replace(validation_anchor, validation_anchor + validation, 1)
          p.write_text(text)
          PY
      - name: Commit status and remove temp workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACTIVE_WORK.md
          git rm .github/workflows/active-work-sync-temp.yml
          git commit -m 'docs: record Blotori workspace asset QA status'
          git push origin HEAD:feature/composer-workspace-v2
