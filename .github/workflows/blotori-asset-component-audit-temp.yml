name: Blotori Asset Component Audit Temp

on:
  push:
    branches: [feature/composer-workspace-v2]
    paths: [.github/workflows/blotori-asset-component-audit-temp.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Inspect pre-clean character components
        run: |
          python -m pip install pillow >/dev/null
          git show e9aa84834f056495c755ed29d678b6a95b3065b8:public/blotori-character-ui.png > /tmp/preclean.png
          mkdir -p component-audit
          python - <<'PY'
          from PIL import Image
          from collections import deque
          im = Image.open('/tmp/preclean.png').convert('RGBA')
          a = im.getchannel('A'); w,h=im.size; p=a.load(); threshold=12
          seen=bytearray(w*h); comps=[]
          for y in range(h):
              for x in range(w):
                  i=y*w+x
                  if seen[i] or p[x,y] <= threshold: continue
                  q=deque([(x,y)]); seen[i]=1; pts=[]
                  while q:
                      cx,cy=q.popleft(); pts.append((cx,cy))
                      for ny in range(max(0,cy-1),min(h,cy+2)):
                          for nx in range(max(0,cx-1),min(w,cx+2)):
                              j=ny*w+nx
                              if not seen[j] and p[nx,ny] > threshold:
                                  seen[j]=1; q.append((nx,ny))
                  xs=[q[0] for q in pts]; ys=[q[1] for q in pts]
                  comps.append((len(pts),(min(xs),min(ys),max(xs)+1,max(ys)+1),pts))
          comps.sort(reverse=True,key=lambda c:c[0])
          print('IMAGE', im.size, 'COMPONENTS', len(comps))
          for idx,(n,b,_) in enumerate(comps[:30]): print(idx,n,b)
          # render labeled audit preserving top components
          out=Image.new('RGBA',im.size,(0,0,0,0)); op=out.load(); src=im.load()
          for idx,(n,b,pts) in enumerate(comps[:12]):
              for x,y in pts: op[x,y]=src[x,y]
          out.save('component-audit/preclean-top12.png')
          im.save('component-audit/preclean-original.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blotori-component-audit
          path: component-audit/
