name: Fix Blotori UI Assets Temp

on:
  push:
    branches: [feature/composer-workspace-v2]
    paths: [.github/workflows/fix-blotori-assets-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Rebuild transparent UI crops from canonical-derived character
        run: |
          python -m pip install pillow >/dev/null
          python - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          src_path = Path('public/blotori-character-ui.png')
          src = Image.open(src_path).convert('RGBA')
          w, h = src.size
          alpha = src.getchannel('A')
          px = alpha.load()
          threshold = 12
          seen = bytearray(w*h)
          components = []

          for y in range(h):
              for x in range(w):
                  idx = y*w+x
                  if seen[idx] or px[x,y] <= threshold:
                      continue
                  q = deque([(x,y)])
                  seen[idx] = 1
                  pts = []
                  while q:
                      cx, cy = q.popleft(); pts.append((cx,cy))
                      for ny in range(max(0,cy-1), min(h,cy+2)):
                          for nx in range(max(0,cx-1), min(w,cx+2)):
                              ni = ny*w+nx
                              if not seen[ni] and px[nx,ny] > threshold:
                                  seen[ni] = 1; q.append((nx,ny))
                  components.append(pts)

          components.sort(key=len, reverse=True)
          if not components or len(components[0]) < 500:
              raise SystemExit('Could not isolate Blotori character component')
          keep = set(components[0])

          clean = Image.new('RGBA', src.size, (0,0,0,0))
          sp = src.load(); cp = clean.load()
          for x,y in keep:
              cp[x,y] = sp[x,y]

          bbox = clean.getchannel('A').getbbox()
          clean = clean.crop(bbox)
          margin_x, margin_y = 10, 12
          char = Image.new('RGBA', (clean.width + margin_x*2, clean.height + margin_y*2), (0,0,0,0))
          char.alpha_composite(clean, (margin_x, margin_y))
          char.save(src_path, optimize=True)

          # Header/app icon: preserve the same canonical pixels, crop the complete head/ears area,
          # then place it on a transparent square with breathing room. No opaque backdrop.
          visible = clean
          head_bottom = min(visible.height, round(visible.height * 0.50))
          head = visible.crop((0, 0, visible.width, head_bottom))
          hb = head.getchannel('A').getbbox()
          head = head.crop(hb)
          # Trim a few bottom pixels so vest/torso does not read as a miniature full-body photo.
          if head.height > 12:
              head = head.crop((0, 0, head.width, max(1, head.height - 5)))
          side = max(head.width, head.height)
          pad = max(16, round(side * 0.12))
          icon = Image.new('RGBA', (side + pad*2, side + pad*2), (0,0,0,0))
          icon.alpha_composite(head, ((icon.width-head.width)//2, (icon.height-head.height)//2))
          icon = icon.resize((256,256), Image.Resampling.LANCZOS)
          icon.save('public/blotori-face-ui.png', optimize=True)

          print('character-ui', char.size, 'bbox', char.getchannel('A').getbbox())
          print('face-ui', icon.size, 'alpha', icon.getchannel('A').getextrema(), 'bbox', icon.getchannel('A').getbbox())
          PY

      - name: Apply clean hero/icon presentation
        run: |
          cat >> app/workspace-v2-final.css <<'CSS'

          /* 2026-09-16 canonical crop correction: no artificial halo, no oversized transform. */
          .workspaceV2 .emptyGlow { display: none !important; }
          .workspaceV2 .blotoriMascotTop {
            width: 48px;
            height: 48px;
            box-sizing: border-box;
            object-fit: contain;
            padding: 3px;
            border-radius: 16px;
            border: 1px solid rgba(105,199,213,.28);
            background: #f5fcfd;
            box-shadow: 0 4px 12px rgba(49,91,122,.07);
          }
          .workspaceV2 .workspaceEmpty {
            background: linear-gradient(145deg, #fffdf9 0%, #f8fcfc 100%);
          }
          .workspaceV2 .emptyMascotStage {
            min-height: 320px;
            overflow: visible;
            margin: 0;
          }
          .workspaceV2 .blotoriMascotEmpty {
            width: auto !important;
            height: 300px !important;
            max-width: 100%;
            max-height: none !important;
            object-fit: contain;
            transform: none !important;
            filter: none !important;
            margin: 0 auto;
            justify-self: center;
          }
          @media (min-width:1181px) {
            .workspaceV2 .workspaceEmpty {
              grid-template-columns: 250px minmax(340px,390px);
              justify-content: center;
              align-items: center;
              align-content: center;
              gap: 38px;
              padding: 44px 34px;
            }
            .workspaceV2 .emptyCopy { padding: 0; max-width: 390px; }
          }
          @media (max-width:900px) {
            .workspaceV2 .emptyMascotStage { min-height: 245px; }
            .workspaceV2 .blotoriMascotEmpty { height: 230px !important; }
          }
          @media (max-width:760px) {
            .workspaceV2 .blotoriMascotTop { width: 44px; height: 44px; }
            .workspaceV2 .emptyMascotStage { min-height: 215px; }
            .workspaceV2 .blotoriMascotEmpty { height: 205px !important; }
          }
          CSS

      - name: Remove temporary diagnostic workflows and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/fix-blotori-assets-temp.yml .github/workflows/asset-crop-diagnostic-temp.yml
          git add public/blotori-character-ui.png public/blotori-face-ui.png app/workspace-v2-final.css
          git commit -m 'fix: rebuild Blotori transparent UI crops and remove hero haze'
          git push origin HEAD:feature/composer-workspace-v2
