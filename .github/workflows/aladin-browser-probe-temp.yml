name: Aladin Browser Probe Temp
on:
  push:
    branches: [feature/blog-dna-adaptive-v1]
    paths:
      - scripts/blog-corpus/probe-aladin-browser.mjs
      - .github/workflows/aladin-browser-probe-temp.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/blog-corpus/probe-aladin-browser.mjs
