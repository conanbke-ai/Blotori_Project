name: Export Historic Blotori Assets Temp

on:
  push:
    branches: [feature/composer-workspace-v2]
    paths: [.github/workflows/export-historic-blotori-assets-temp.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Export historic candidate assets
        run: |
          mkdir -p historic-assets
          for spec in \
            'f21462c47c07fd798c91b7aeeb1b487a92426ae4:public/blotori-canonical-mini.webp:f21462-canonical-mini.webp' \
            '323da310c5902bbc4aaa4a206b63b0e2f0578b3f:public/blotori-canonical-mini.webp:323da-canonical-mini.webp' \
            '323da310c5902bbc4aaa4a206b63b0e2f0578b3f:public/blotori-face-ui.webp:323da-face-ui.webp' \
            '10d82ec19aebf68b11a670a23ffd8b3756b61a8a:public/blotori-character-transparent.webp:10d82-character.webp' \
            '10d82ec19aebf68b11a670a23ffd8b3756b61a8a:public/blotori-icon-transparent.webp:10d82-icon.webp' \
            '61080244661d7514356cea4914f67c17d615c49f:public/blotori-canonical-mini.webp:610802-canonical-mini.webp'; do
            commit="${spec%%:*}"; rest="${spec#*:}"; path="${rest%%:*}"; out="${rest##*:}"
            if git cat-file -e "$commit:$path" 2>/dev/null; then
              git show "$commit:$path" > "historic-assets/$out"
              file "historic-assets/$out" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: historic-blotori-assets
          path: historic-assets/
          if-no-files-found: error
