name: Naver PostView Probe Temp
on:
  push:
    branches: [feature/blog-dna-adaptive-v1]
    paths:
      - .github/workflows/naver-postview-probe-temp.yml
      - scripts/blog-corpus/probe-naver-postview.mjs
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/blog-corpus/probe-naver-postview.mjs
