name: Blog DNA Validate Temp

on:
  push:
    branches: [feature/blog-dna-adaptive-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOTORI_MOCK_MODE: "true"
      OPENAI_MODEL: "gpt-5.6-luna"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Platform export QA
        run: npm run qa:platform
      - name: Production build
        run: npm run build
