name: Full Naver Corpus Pilot Temp
on:
  push:
    branches: [feature/blog-dna-adaptive-v1]
    paths:
      - scripts/blog-corpus/naver-corpus-lib.mjs
      - scripts/blog-corpus/collect-naver-full-corpus.mjs
      - package.json
      - .github/workflows/full-naver-corpus-pilot-temp.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Analyze every public post in pilot blog
        run: node scripts/blog-corpus/collect-naver-full-corpus.mjs --blog roooad --output tmp-blog-corpus/pilot --delay-ms 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-naver-corpus-pilot
          path: tmp-blog-corpus/pilot/
          if-no-files-found: error
