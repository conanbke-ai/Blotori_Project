name: Category Blog DNA Validate Temp

on:
  push:
    branches: [feature/blog-dna-adaptive-v1]
    paths:
      - lib/domain/category-blog-dna.ts
      - app/BlotoriAssetStudio.tsx
      - app/page.tsx
      - lib/infrastructure/rendered-blog-capture.ts
      - .github/workflows/category-blog-dna-validate-temp.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOTORI_MOCK_MODE: "true"
      OPENAI_MODEL: "gpt-5.6-luna"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Platform QA
        run: npm run qa:platform
      - name: Production build
        run: npm run build
