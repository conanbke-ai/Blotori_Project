name: Final Blotori Polish Temp

on:
  push:
    branches:
      - feature/composer-workspace-v2
    paths:
      - .github/workflows/final-polish-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Apply scoped text and QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/BlotoriAssetStudio.tsx': [
              ("payload.customStyle = `${profile.signature}\\n\\n이 문체 프로필의 이름은 '${profile.name}'이다. 문장 자체를 복제하지 말고 분석된 특성만 적용한다.`;",
               "payload.customStyle = `${profile.signature}\\n\\n원문 문장을 복제하지 말고 분석된 문체 특성만 적용한다.`;"),
            ],
            'app/page.tsx': [
              ('title="문체와 구성" description="자동 추천을 기본으로 두고 필요할 때만 조정해요."',
               'title="기본 문체 · 글 구성" description="저장한 내 문체를 쓰지 않을 때 적용할 기본값과 글 구조를 정해요."'),
              ('"이번 글은 Knowledge Base 근거를 사용하지 않았어요."',
               '"이번 글은 등록된 전문자료를 참고하지 않았어요."'),
              ('"현재 Rule Engine에서 감지된 주의 표현이 없어요."',
               '"현재 감지된 주의 표현이 없어요."'),
            ],
            'scripts/visual-qa-temp.mjs': [
              ('page.locator(".loadingOverlay")', 'page.locator(".generationOverlay")'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Missing scoped target in {filename}: {old[:80]}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/BlotoriAssetStudio.tsx app/page.tsx scripts/visual-qa-temp.mjs
          git commit -m 'fix: polish saved style metadata and workspace copy'
          git push origin HEAD:feature/composer-workspace-v2
