name: Naver Blog Render Test Temp

on:
  push:
    branches: [feature/blog-dna-adaptive-v1]
    paths:
      - scripts/tmp-test-naver-blog.mjs
      - .github/workflows/naver-blog-render-test-temp.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Render supplied Naver blog URL
        run: node scripts/tmp-test-naver-blog.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-blog-render-evidence
          path: tmp-naver-blog-test/
          if-no-files-found: warn
