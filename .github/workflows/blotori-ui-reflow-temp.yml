name: Blotori UI Reflow Temp

on:
  push:
    branches:
      - feature/composer-workspace-v2
    paths:
      - .github/workflows/blotori-ui-reflow-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Apply scoped workspace reflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          t = p.read_text()
          reps = [
            ('<div className="eyebrow">BLOTORI · BLOG WORKSPACE</div>\n            <h1>글과 이미지를 엮어, 이야기를 완성해요.</h1>\n            <p>주제와 몇 가지 조건만 정하면 플랫폼에 맞는 글 구조·강조·이미지 배치까지 한 번에 구성합니다.</p>',
             '<div className="eyebrow">BLOTORI · BLOG STUDIO</div>\n            <h1>글과 이미지를 엮어, 이야기를 완성해요.</h1>\n            <p>자료를 넣고 문체를 고르면, 게시할 수 있는 블로그 초안과 이미지 가이드까지 한 흐름으로 완성해요.</p>'),
            ('>설정</button>\n        <button className={mobilePanel === "preview" ? "active" : ""} onClick={() => setMobilePanel("preview")}>미리보기</button>\n        <button className={mobilePanel === "review" ? "active" : ""} onClick={() => setMobilePanel("review")}>이미지·검수</button>',
             '>입력 · 문체</button>\n        <button className={mobilePanel === "preview" ? "active" : ""} onClick={() => setMobilePanel("preview")}>초안</button>\n        <button className={mobilePanel === "review" ? "active" : ""} onClick={() => setMobilePanel("review")}>이미지 · 검수</button>'),
            ('<h2>작성 설정</h2><p>무엇을, 어디에, 어떤 방식으로 쓸지 정해요.</p>',
             '<h2>입력 · 문체</h2><p>플랫폼과 주제를 정하고, 참고자료와 문체를 선택해요.</p>'),
            ('<span className="subtle">플랫폼 + 주제 필수</span>', '<span className="subtle">필수 2개 · 나머지 선택</span>'),
            ('title="플랫폼" description="게시할 공간에 맞춰 글 구조와 복사 형식이 달라져요."',
             'title="게시 플랫폼" description="게시할 공간에 맞춰 글 구조와 복사 형식을 준비해요."'),
            ('title="주제" description="추천 주제를 고르거나 자유롭게 입력할 수 있어요."',
             'title="글 주제" description="추천 주제를 고르거나 직접 쓸 내용을 입력해요."'),
            ('title="출력 설정" description="글 길이와 이미지 수, 기타 요청을 마지막으로 확인해요."',
             'title="최종 옵션" description="글 길이·이미지 수와 꼭 반영할 요청만 마지막으로 확인해요."'),
            ('{loading ? "구성 중…" : "✦ 블로그 글 생성하기"}', '{loading ? "블로토리가 초안을 만드는 중…" : "✦ 블로그 초안 만들기"}'),
            ('<small>글 생성은 기본 AI 호출 1회로 진행돼요.</small>', '<small>입력한 자료·문체·옵션을 반영해 하나의 초안으로 정리해요.</small>'),
            ('{platformProfile ? `${platformProfile.label} 게시물 미리보기` : "게시물 미리보기"}', '{platformProfile ? `${platformProfile.label} 초안 미리보기` : "초안 미리보기"}'),
            ('{platformProfile ? `${platformProfile.label} 형식으로 실제 게시될 모습을 확인해요.` : "플랫폼을 선택하면 해당 형식에 맞춰 보여드려요."}', '{platformProfile ? `${platformProfile.label}에 옮기기 전 실제 글 흐름을 확인해요.` : "플랫폼을 선택하면 해당 형식에 맞춰 보여드려요."}'),
            ('<span className="generationMeta">AI 호출은 기존 1회 그대로예요.</span>', '<span className="generationMeta">자료와 문체를 반영해 게시 전 초안을 정리하고 있어요.</span>'),
          ]
          for old,new in reps:
            if old not in t:
              raise SystemExit(f'Missing page target: {old[:100]}')
            t=t.replace(old,new,1)
          p.write_text(t)

          p = Path('app/BlotoriAssetStudio.tsx')
          t = p.read_text()
          reps = [
            ('<h3>참고자료</h3><em>선택</em></div><p>이번 글의 내용·근거로 참고할 파일을 올리거나 자료함에서 골라요.</p>',
             '<h3>참고자료 · 내 자료함</h3><em>선택</em></div><p>이번 글에서 실제로 참고할 파일을 올리거나, 저장해 둔 자료에서 골라요.</p>'),
            ('<strong>＋ 참고자료 추가</strong><span>PDF · DOCX · TXT · MD, 파일당 12MB 이하</span>',
             '<strong>＋ 파일 올리기</strong><span>PDF · DOCX · TXT · MD · 파일당 12MB 이하</span>'),
            ('<p className="assetHint">체크한 자료만 이번 글에 참고합니다. 현재 V1 자료함은 이 브라우저에 저장돼요.</p>',
             '<p className="assetHint">체크한 자료만 이번 글에 사용해요. 올린 자료는 내 자료함에 남아 다음 글에서도 다시 선택할 수 있어요.</p>'),
            ('<h3>문체 · 글 구성</h3></div><p>기본 문체와 저장한 내 문체를 한곳에서 고르고, 글의 구조와 강도까지 함께 정해요.</p>',
             '<h3>내 문체 · 글 구성</h3></div><p>저장한 문체를 다시 쓰거나 새 문체를 만들고, 이번 글의 구성과 강도를 조정해요.</p>'),
            ('<span>현재 적용 문체</span><small>이번 글에서 사용할 말투를 고릅니다.</small>',
             '<span>이번 글에 적용할 문체</span><small>저장한 내 문체 또는 블로토리 기본 문체를 선택해요.</small>'),
            ('<span>새 문체 만들기</span><small>참고 글을 분석해 이름을 붙여 저장하고 반복 사용합니다.</small>',
             '<span>새 문체 저장하기</span><small>블로그 전체·포스팅 1개·붙여넣은 글을 분석해 이름을 붙여 반복 사용해요.</small>'),
            ('<strong>자료 · 문체 공유</strong><span>문체와 선택한 자료를 .blotori 파일로 묶어 다른 사용자에게 전달할 수 있어요.</span>',
             '<strong>블로토리 팩</strong><span>문체와 선택한 자료를 .blotori 파일 하나로 묶어 다른 사용자에게 전달하거나 다시 가져올 수 있어요.</span>'),
          ]
          for old,new in reps:
            if old not in t:
              raise SystemExit(f'Missing asset target: {old[:100]}')
            t=t.replace(old,new,1)
          p.write_text(t)

          p = Path('app/workspace-v2-consistency.css')
          t = p.read_text()
          t += '''\n\n/* Product-flow emphasis: upload and reusable writing assets read as primary steps. */\n.workspaceV2 .referenceMaterialGroup {\n  background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(240,251,252,.82)) !important;\n  border-color: rgba(45,143,160,.28) !important;\n}\n.workspaceV2 .referenceMaterialGroup .assetDropzone {\n  min-height: 92px !important;\n  border: 1.5px dashed rgba(45,143,160,.42) !important;\n  background: rgba(105,199,213,.075) !important;\n}\n.workspaceV2 .referenceMaterialGroup .assetDropzone strong {\n  color: #2d8fa0 !important;\n  font-size: 12.5px !important;\n}\n.workspaceV2 .unifiedWritingGroup {\n  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,249,242,.88)) !important;\n}\n.workspaceV2 .assetUtilityGroup {\n  margin: 2px 0 12px !important;\n  padding: 12px !important;\n  border: 1px solid rgba(49,91,122,.10) !important;\n  background: rgba(255,253,249,.84) !important;\n}\n.workspaceV2 .generatePrimary {\n  min-height: 50px !important;\n  border-radius: 14px !important;\n  font-size: 13px !important;\n  font-weight: 850 !important;\n}\n.workspaceV2 .workspaceEmpty .emptyQuickActions {\n  margin-top: 16px !important;\n}\n.workspaceV2 .workspaceEmpty .emptyQuickActions button:first-child {\n  box-shadow: 0 8px 18px rgba(45,143,160,.12) !important;\n}\n@media (max-width: 760px) {\n  .workspaceV2 .mobileWorkspaceTabs button {\n    font-size: 11px !important;\n  }\n}\n'''
          p.write_text(t)
          PY
      - name: Commit UI reflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/BlotoriAssetStudio.tsx app/workspace-v2-consistency.css
          git commit -m 'refactor: clarify Blotori authoring flow and asset hierarchy'
          git push origin HEAD:feature/composer-workspace-v2
