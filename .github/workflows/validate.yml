name: Blotori Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOTORI_MOCK_MODE: "true"
      OPENAI_MODEL: "gpt-5.6-luna"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Content design targeted TypeScript check
        run: npx --no-install tsc -p tsconfig.content-design-check.json

      - name: Draft section order QA
        run: node scripts/validate-draft-section-order.mjs

      - name: Layout plan status safety QA
        run: node scripts/validate-layout-plan-status-safety.mjs

      - name: Content layout plan generation QA
        run: node scripts/validate-content-layout-plan-generation.mjs

      - name: Non-food input summary QA
        run: node scripts/validate-nonfood-input-summary.mjs

      - name: Observed style admission QA
        run: node scripts/validate-category-blog-presets-admission.mjs

      - name: Observed category style runtime QA
        run: node scripts/validate-observed-style-runtime.mjs

      - name: Mock style oracle QA
        run: node scripts/validate-mock-style-oracle.mjs

      - name: Content design pipeline QA
        run: node scripts/validate-content-design-pipeline.mjs

      - name: Food review provenance QA
        run: node scripts/validate-food-review-facts.mjs

      - name: Food review generation contract QA
        run: node scripts/validate-food-review-generation-contract.mjs

      - name: Platform export QA
        run: npm run qa:platform

      - name: Next.js production build
        run: npm run build
