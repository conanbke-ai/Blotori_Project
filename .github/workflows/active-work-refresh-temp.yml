name: Blotori Active Work Refresh Temp

on:
  push:
    branches:
      - feature/composer-workspace-v2
    paths:
      - .github/workflows/active-work-refresh-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - name: Append current composer V2 status
        run: |
          cat >> ACTIVE_WORK.md <<'EOF'

## Composer Workspace V2 — 2026-09-15

- Status: `IN_PROGRESS / VISUAL_REVIEW`
- Branch: `feature/composer-workspace-v2`
- Draft PR: `#13`
- [x] 참고자료 업로드 영역을 작성 흐름에 추가
- [x] 선택한 참고파일을 이번 글 생성 요청에 실제 첨부
- [x] 브라우저 로컬 자료함에 참고자료 보관/재선택
- [x] 이름을 직접 지정하는 재사용 `StyleProfile` / 내 문체 구현
- [x] 블로그 전체 URL / 포스팅 1개 URL / 글 붙여넣기 / 직접 설정 문체 생성 경로
- [x] 저장 문체 선택 시 분석된 문체 특성만 생성 요청에 적용하고 프로필명은 본문에서 분리
- [x] 문체/참고자료 `.blotori` 공유팩 export/import
- [x] 기존 기본 문체·글 구성과 저장형 내 문체 UI 역할 분리
- [x] 생성 중 실제 loading overlay 및 단계 안내 노출
- [x] 사용자 화면의 Knowledge Base / Rule Engine 내부 용어 제거
- [x] 좌상단 브랜드를 common TORI paw가 아닌 canonical Blotori 얼굴 아이콘으로 교체
- [x] 빈 미리보기 / 생성 로딩 / error 상태에 canonical Blotori 전신 적용
- [x] 캐릭터 UI PNG는 승인된 canonical 픽셀에서 crop/mask만 수행하고 재생성하지 않음
- [x] desktop / tablet / mobile production Playwright 캡처 수행
- [x] 최신 `Blotori Validate` TypeScript / platform export QA / Next.js production build PASS
- [ ] 사용자 최종 visual acceptance
- [ ] visual QA 임시 workflow/script 제거 후 PR #13 merge readiness 재검증

### Current asset roles

- `public/blotori-face-ui.png` — 상단 브랜드 얼굴 아이콘
- `public/blotori-character-ui.png` — empty / generating / route loading / error 전신 캐릭터
- `public/blotori-paw-default.png`, `public/blotori-paw-pressed.png` — cursor / 완료 피드백 전용

발바닥 자산을 브랜드 얼굴이나 전신 캐릭터 대체물로 사용하지 않는다.
EOF
      - name: Commit status update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACTIVE_WORK.md
          git commit -m 'docs: update Blotori composer V2 active work'
          git push origin HEAD:feature/composer-workspace-v2
