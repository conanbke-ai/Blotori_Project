name: Final Blotori Asset Polish Temp

on:
  push:
    branches: [feature/composer-workspace-v2]
    paths: [.github/workflows/final-blotori-asset-polish-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0

      - name: Clean canonical UI crops
        run: |
          python -m pip install pillow >/dev/null
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          char_path = Path('public/blotori-character-ui.png')
          im = Image.open(char_path).convert('RGBA')
          px = im.load()

          # Remove only the tiny disconnected residue visible above-left of the ear.
          # The canonical character itself does not occupy this top-left corner.
          for y in range(min(62, im.height)):
              for x in range(min(58, im.width)):
                  px[x, y] = (0, 0, 0, 0)

          bbox = im.getchannel('A').getbbox()
          if not bbox:
              raise SystemExit('Blotori character became empty')
          core = im.crop(bbox)
          margin_x, margin_y = 10, 12
          clean = Image.new('RGBA', (core.width + margin_x * 2, core.height + margin_y * 2), (0,0,0,0))
          clean.alpha_composite(core, (margin_x, margin_y))
          clean.save(char_path, optimize=True)

          # Rebuild a tighter transparent face icon from the same exact character pixels.
          head_bottom = min(core.height, round(core.height * 0.50))
          head = core.crop((0, 0, core.width, head_bottom))
          hb = head.getchannel('A').getbbox()
          if not hb:
              raise SystemExit('Blotori head crop became empty')
          head = head.crop(hb)
          if head.height > 12:
              head = head.crop((0, 0, head.width, max(1, head.height - 5)))

          side = max(head.width, head.height)
          pad = max(8, round(side * 0.055))
          icon = Image.new('RGBA', (side + pad*2, side + pad*2), (0,0,0,0))
          icon.alpha_composite(head, ((icon.width-head.width)//2, (icon.height-head.height)//2))
          icon = icon.resize((256,256), Image.Resampling.LANCZOS)
          icon.save('public/blotori-face-ui.png', optimize=True)

          print('character', clean.size, clean.getchannel('A').getbbox())
          print('icon', icon.size, icon.getchannel('A').getbbox(), icon.getchannel('A').getextrema())
          PY

      - name: Make loading character visibly large
        run: |
          cat >> app/workspace-v2-final.css <<'CSS'

          /* 2026-09-16 final visible-size correction for canonical Blotori loading state. */
          .generationOverlay .loadingMascot {
            width: auto !important;
            height: 190px !important;
            max-width: 100% !important;
            max-height: none !important;
            object-fit: contain !important;
            transform: none !important;
            filter: none !important;
            margin: 0 auto 8px !important;
          }
          @media (max-width: 760px) {
            .generationOverlay .loadingMascot {
              height: 145px !important;
            }
          }
          CSS

      - name: Remove temporary workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/final-blotori-asset-polish-temp.yml
          git add public/blotori-character-ui.png public/blotori-face-ui.png app/workspace-v2-final.css
          git commit -m 'fix: finalize Blotori icon crop and loading scale'
          git push origin HEAD:feature/composer-workspace-v2
