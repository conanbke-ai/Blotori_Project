name: Blotori Asset Recovery Temp

on:
  push:
    branches:
      - feature/composer-workspace-v2
    paths:
      - .github/workflows/asset-recovery-temp.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode existing transparent Blotori assets
        run: |
          mkdir -p recovered
          base64 -d public/blotori-character-transparent.webp > recovered/blotori-character-transparent.webp
          base64 -d public/blotori-face-ui.webp > recovered/blotori-face-ui.webp
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for src_name, out_name in [
              ('blotori-character-transparent.webp', 'blotori-character-canonical.png'),
              ('blotori-face-ui.webp', 'blotori-face-canonical.png'),
          ]:
              src = Path('recovered') / src_name
              im = Image.open(src).convert('RGBA')
              print(src_name, 'size=', im.size, 'format=', Image.open(src).format, 'alpha=', im.getchannel('A').getextrema())
              bbox = im.getchannel('A').getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.save(Path('recovered') / out_name, optimize=True)
              print(out_name, 'cropped=', im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blotori-decoded-canonical
          path: recovered/
          if-no-files-found: error
