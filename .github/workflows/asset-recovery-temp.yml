name: Blotori Asset Recovery Temp

on:
  push:
    branches:
      - feature/composer-workspace-v2
    paths:
      - .github/workflows/asset-recovery-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/composer-workspace-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical UI crops and wire them into the app
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path

          src = Image.open('public/blotori-canonical-mini.webp').convert('RGBA')
          w, h = src.size

          # Full-body product asset. This is a crop/mask of the approved canonical,
          # never a redraw. Masks only remove standard-sheet typography around it.
          m = Image.new('L', (w, h), 0)
          d = ImageDraw.Draw(m)
          d.polygon([(55,0),(88,0),(107,98),(94,122),(75,96),(51,45)], fill=255)
          d.polygon([(123,0),(162,0),(158,108),(140,126),(123,91)], fill=255)
          d.ellipse((50,88,204,224), fill=255)
          d.ellipse((39,170,94,238), fill=255)
          d.polygon([(45,164),(64,161),(71,217),(51,238),(39,215)], fill=255)
          d.polygon([(69,199),(105,188),(149,198),(172,235),(165,316),(120,338),(77,306),(58,260)], fill=255)
          d.polygon([(145,180),(199,179),(202,282),(153,293),(140,229)], fill=255)
          d.ellipse((183,235,219,279), fill=255)
          d.rounded_rectangle((119,228,174,326), radius=14, fill=255)
          d.ellipse((72,278,171,358), fill=255)
          d.ellipse((75,316,124,408), fill=255)
          d.ellipse((113,317,166,400), fill=255)
          d.rectangle((0,0,54,28), fill=0)
          m = m.filter(ImageFilter.GaussianBlur(1.0))
          full = src.copy(); full.putalpha(m); full = full.crop(m.getbbox())
          alpha = full.getchannel('A'); ad = ImageDraw.Draw(alpha)
          ad.rectangle((0,0,30,25), fill=0)
          ad.rectangle((0,238,20,315), fill=0)
          full.putalpha(alpha)
          full.save('public/blotori-character-ui.png', optimize=True)

          # Face app icon, also cropped from the same approved canonical.
          fm = Image.new('L', (w, h), 0)
          fd = ImageDraw.Draw(fm)
          fd.polygon([(55,0),(88,0),(107,98),(94,122),(75,96),(51,45)], fill=255)
          fd.polygon([(123,0),(162,0),(158,108),(140,126),(123,91)], fill=255)
          fd.ellipse((50,88,204,224), fill=255)
          fd.rectangle((0,0,54,28), fill=0)
          fm = fm.filter(ImageFilter.GaussianBlur(1.0))
          face = src.copy(); face.putalpha(fm); face = face.crop(fm.getbbox())
          canvas = Image.new('RGBA', (256,256), (255,249,242,255))
          face.thumbnail((224,224), Image.Resampling.LANCZOS)
          canvas.alpha_composite(face, ((256-face.width)//2, (256-face.height)//2))
          ImageDraw.Draw(canvas).rectangle((0,0,92,26), fill=(255,249,242,255))
          canvas.save('public/blotori-face-ui.png', optimize=True)

          # Wire the semantic assets to their intended UI roles.
          replacements = {
            'app/page.tsx': [
              ('src="/blotori-canonical-mini.webp" alt="블로토리"', 'src="/blotori-face-ui.png" alt="블로토리"', 1),
              ('className="blotoriMascotEmpty" src="/blotori-canonical-mini.webp"', 'className="blotoriMascotEmpty" src="/blotori-character-ui.png"', 1),
              ('className="loadingMascot" src="/blotori-canonical-mini.webp"', 'className="loadingMascot" src="/blotori-character-ui.png"', 1),
            ],
            'app/BlotoriLoadingMotion.tsx': [
              ('src="/blotori-character-transparent.webp"', 'src="/blotori-character-ui.png"', 1),
            ],
            'app/error.tsx': [
              ('src="/blotori-character-transparent.webp"', 'src="/blotori-character-ui.png"', 1),
            ],
          }
          for filename, pairs in replacements.items():
            p = Path(filename); text = p.read_text()
            for old, new, count in pairs:
              if old not in text:
                raise SystemExit(f'Missing target in {filename}: {old}')
              text = text.replace(old, new, count)
            p.write_text(text)

          css = Path('app/workspace-v2-fixes.css')
          text = css.read_text()
          old = '''.workspaceV2 .blotoriMascotTop {\n  display: none;\n}\n\n.workspaceV2 .compactBrand::before {\n  content: \"\";\n  flex: 0 0 auto;\n  display: block;\n  width: 58px;\n  height: 58px;\n  border-radius: 20px;\n  background-color: #fff;\n  background-image: url('/blotori-canonical-mini.webp');\n  background-repeat: no-repeat;\n  background-size: 106px auto;\n  background-position: center -22px;\n  border: 1px solid rgba(105, 199, 213, .34);\n  box-shadow: 0 9px 22px rgba(49, 91, 122, .10);\n}\n'''
          new = '''.workspaceV2 .blotoriMascotTop {\n  display: block;\n  flex: 0 0 auto;\n  width: 58px;\n  height: 58px;\n  object-fit: contain;\n  border-radius: 20px;\n  border: 1px solid rgba(105, 199, 213, .34);\n  box-shadow: 0 9px 22px rgba(49, 91, 122, .10);\n}\n\n.workspaceV2 .compactBrand::before {\n  content: none;\n  display: none;\n}\n'''
          if old not in text:
            raise SystemExit('Missing brand CSS target')
          text = text.replace(old, new, 1)
          text = text.replace('''  .workspaceV2 .compactBrand::before {\n    width: 52px;\n    height: 52px;\n    background-size: 96px auto;\n    background-position: center -20px;\n  }''', '''  .workspaceV2 .blotoriMascotTop {\n    width: 52px;\n    height: 52px;\n  }''')
          text = text.replace('''  .workspaceV2 .compactBrand::before {\n    width: 46px;\n    height: 46px;\n    border-radius: 16px;\n    background-size: 85px auto;\n    background-position: center -18px;\n  }''', '''  .workspaceV2 .blotoriMascotTop {\n    width: 46px;\n    height: 46px;\n    border-radius: 16px;\n  }''')
          css.write_text(text)
          PY
      - name: Commit canonical UI assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/blotori-character-ui.png public/blotori-face-ui.png app/page.tsx app/BlotoriLoadingMotion.tsx app/error.tsx app/workspace-v2-fixes.css
          git commit -m 'fix: use canonical Blotori face and full-body assets'
          git push origin HEAD:feature/composer-workspace-v2
